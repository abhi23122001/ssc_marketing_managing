name: Validate SHAH AI workspace

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workspace and Hermes submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate SHAH AI project files
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s AGENTS.md
          test -s .gitmodules
          test -s config/SOUL.md
          test -s .hermes/skills/shah-ai/SKILL.md
          test -s brand/ssc-brand-profile.md
          test -s docs/SETUP-WINDOWS.md
          test -f vendor/hermes-agent/README.md
          test -f vendor/hermes-agent/LICENSE
          grep -q 'path = vendor/hermes-agent' .gitmodules
          if git submodule status vendor/hermes-agent | grep -q '^-'; then
            echo "Hermes submodule is not initialized" >&2
            exit 1
          fi

          # SHAH AI extension files
          test -s COMMAND-CENTER.md
          test -s Start-SHAI-Center.ps1
          test -s modules/README.md
          for m in 01 02 03 04 05 06 07 08 09 10 11 12 13 14; do
            shopt -s nullglob
            module_dirs=(modules/"$m"-*/)
            shopt -u nullglob
            if [ "${#module_dirs[@]}" -eq 0 ]; then
              echo "missing module folder: modules/$m-" >&2
              exit 1
            fi
            test -s modules/"$m"-*/README.md
          done
          test -s shared/templates/marketing-brief-template.md
          test -s shared/templates/content-template.md
          test -s shared/templates/approval-form.md
          test -s shared/templates/qa-checklist.md
          test -s shared/scripts/Open-Readme.ps1
          test -s shared/scripts/Write-Draft.ps1
          test -s docs/MODULES-ARCHITECTURE.md
          echo "SHAH AI extension modules and shared files present."
